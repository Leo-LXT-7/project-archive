<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵感项目存档</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fafaf9;
    color: #18181b;
    line-height: 1.6;
    min-height: 100vh;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  /* 页头 */
  header { margin-bottom: 48px; }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  header p {
    margin-top: 6px;
    font-size: 14px;
    color: #8e8e98;
  }

  /* 卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid #e9e9e7;
    border-radius: 16px;
    overflow: hidden;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #d9d9d6;
    box-shadow: 0 12px 28px rgba(0,0,0,.08);
  }

  .cover {
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: linear-gradient(135deg, #ede9fe, #e0e7ff);
  }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease;
  }
  .card:hover .cover img { transform: scale(1.04); }

  .card-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
  }

  .arrow {
    flex: none;
    color: #a1a1aa;
    font-size: 14px;
    transition: color .2s ease, transform .2s ease;
  }
  .card:hover .arrow {
    color: #6d5ef6;
    transform: translate(2px, -2px);
  }

  footer {
    margin-top: 56px;
    font-size: 13px;
    color: #b3b3b0;
    text-align: center;
  }

  @media (max-width: 640px) {
    .wrap { padding: 40px 16px 56px; }
    header { margin-bottom: 32px; }
    header h1 { font-size: 22px; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>灵感项目存档</h1>
      <p>3 个项目点子 · 点击卡片查看完整文档</p>
    </header>

    <main class="grid">
      <a class="card" href="docs/ai-yijian-chuquan.html" target="_blank" rel="noopener">
        <div class="cover">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Modern%20minimal%20flat%20illustration%2C%20a%20glowing%20rocket%20launching%20upward%20through%20abstract%20network%20lines%20and%20nodes%2C%20deep%20indigo%20and%20violet%20gradient%20background%2C%20modern%20tech%20style%2C%20clean%20composition%2C%20no%20text&image_size=landscape_4_3" alt="AI一键出“圈”封面">
        </div>
        <div class="card-title">
          <span>AI一键出“圈”</span>
          <span class="arrow">↗</span>
        </div>
      </a>

      <a class="card" href="docs/ai-gongchuang-pingtai.html" target="_blank" rel="noopener">
        <div class="cover">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Minimal%20flat%20illustration%2C%20three%20people%20collaborating%20around%20a%20large%20shared%20glowing%20canvas%20with%20creative%20blocks%2C%20soft%20light%20background%20with%20violet%20accent%2C%20modern%20clean%20style%2C%20no%20text&image_size=landscape_4_3" alt="AI共创作品平台封面">
        </div>
        <div class="card-title">
          <span>AI共创作品平台</span>
          <span class="arrow">↗</span>
        </div>
      </a>

      <a class="card" href="docs/shaonian-tianfu-tanjiu.html" target="_blank" rel="noopener">
        <div class="cover">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Warm%20minimal%20flat%20illustration%2C%20a%20young%20student%20surrounded%20by%20floating%20colorful%20icons%20of%20music%2C%20painting%2C%20sports%2C%20science%20and%20stars%2C%20bright%20friendly%20pastel%20colors%2C%20education%20and%20discovery%20theme%2C%20no%20text&image_size=landscape_4_3" alt="青少年天赋挖掘封面">
        </div>
        <div class="card-title">
          <span>青少年天赋挖掘——多元兴趣探索计划</span>
          <span class="arrow">↗</span>
        </div>
      </a>
    </main>

    <footer>项目点子，欢迎讨论</footer>
  </div>
</body>
</html>
